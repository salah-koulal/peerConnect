<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>peerConnect — Login</title>
  
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    html, body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center px-4">

  <main class="w-full max-w-md bg-gray-800 rounded-xl shadow-lg p-8">
    <h1 class="text-3xl font-semibold mb-6 text-center text-indigo-400">peerConnect</h1>
    <p class="mb-8 text-center text-gray-400">Connect with fellow learners and find your perfect study group.</p>

    <form id="loginForm" class="space-y-6" action="#" method="POST">
      <div>
        <label for="login" class="block mb-2 text-sm font-medium text-gray-300">Username or Email</label>
        <input
          id="login"
          name="login"
          type="text"
          required
          class="w-full px-4 py-3 rounded-md bg-gray-700 border border-gray-600 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="Enter your login"
        />
      </div>

      <div>
        <label for="password" class="block mb-2 text-sm font-medium text-gray-300">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          class="w-full px-4 py-3 rounded-md bg-gray-700 border border-gray-600 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="Enter your password"
        />
      </div>

      <button
        type="submit"
        class="w-full py-3 rounded-md bg-indigo-600 hover:bg-indigo-700 transition-colors font-semibold text-lg"
      >
        Log In
      </button>
    </form>

    <p class="mt-6 text-center text-gray-500 text-sm">
      New to peerConnect? <a href="register.html" class="text-indigo-400 hover:underline">Create an account</a>
    </p>
  </main>

</body>
</html>
